name: Python quality checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install locked development environment
        run: uv sync --locked --group dev
      - name: Lint
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff check --extension tmpl:python src/boltra/project/templates/main.py.tmpl src/boltra/project/templates/settings.py.tmpl
      - name: Formatting
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff format --check --extension tmpl:python src/boltra/project/templates/main.py.tmpl src/boltra/project/templates/settings.py.tmpl
      - name: Types
        run: uv run --no-sync mypy src
      - name: Tests, HTTP integration, and packaging
        run: uv run --no-sync pytest
      - name: Build wheel and source distribution
        run: uv build
