[project]
name = "boltra"
version = "0.5.0"
description = "A Python API development toolkit, starting with FastAPI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Boltra Contributors" }]
keywords = ["fastapi", "cli", "scaffolding", "async", "python"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/babar-xagi/boltra"
Repository = "https://github.com/babar-xagi/boltra"
Documentation = "https://github.com/babar-xagi/boltra/tree/main/doc"
Changelog = "https://github.com/babar-xagi/boltra/blob/main/doc/plan/CHANGELOG.md"

[project.scripts]
boltra = "boltra.cli.cli:run"

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "mypy>=1.14",
    "pydantic-settings>=2.6",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=7.0",
    "ruff>=0.9",
    "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boltra"]

# Limit source archives to maintained files; nested .env.example ignore rules
# must never pull temporary generated apps into a published distribution.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/doc",
    "/benchmarks/README.md",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
    "/boltra-doc.md",
    "/.github",
    "/.gitignore",
    "/.gitattributes",
    "/.pre-commit-config.yaml",
]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["boltra"]
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: integration tests that start external processes",
    "packaging: build and inspect the distributable Python package",
]
